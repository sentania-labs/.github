# Have Apple notarize a signed macOS binary, and remove the signing keychain.
#
# Runs after macos-sign (and after the caller's own smoke test, if any). The
# gate is notarytool reporting Accepted: that is Apple stating it notarized
# this binary, and anything else fails the step. A release that depends on
# this depends on Apple; when the notary service is slow or down the caller's
# release fails and nothing ships, which is the intended outcome (an unsigned
# macOS binary nobody can run is the problem this exists to fix). Recovery is
# `gh run rerun <run-id> --failed` against the same tag.
#
# Two modes. `binary` (a bare executable): the ticket is NOT stapled, because a
# ticket can only be stapled to a bundle (.app, .dmg, .pkg). The first run on a
# given Mac asks Apple about the binary over the network. `bundle` (a .app
# signed by macos-sign in bundle mode): the ticket IS stapled, the staple is
# validated, Gatekeeper must accept the app (a hard gate, not advisory), and
# the release zip is rebuilt from the stapled app (`ditto -c -k --keepParent`)
# at `output-zip`. Ship that zip, not the one used for submission.
#
# Secrets come from the caller as inputs: NOTARY_ISSUER_ID, NOTARY_KEY_ID,
# NOTARY_KEY_P8 (base64 of the App Store Connect API key .p8).

name: macOS notarize
description: Submit a signed binary to Apple's notary service and fail unless it is Accepted.

inputs:
  binary:
    description: Path of the signed bare Mach-O to notarize. Exactly one of binary or bundle.
    required: false
    default: ""
  bundle:
    description: Path of the signed .app to notarize and staple. Exactly one of binary or bundle.
    required: false
    default: ""
  output-zip:
    description: >
      Bundle mode only: where to write the final zip, built after stapling.
      Defaults to the bundle path with .zip appended to its name (dist/X.app
      becomes dist/X.app.zip).
    required: false
    default: ""
  timeout:
    description: >
      How long to wait for Apple's verdict (notarytool --timeout syntax). On
      2026-09-15 Apple took 68 to 96 minutes for the first two submissions from
      this org; elsewhere it is usually under a minute. Waiting costs nothing
      when Apple is quick.
    required: false
    default: 2h
  notary-issuer-id:
    description: secrets.NOTARY_ISSUER_ID
    required: true
  notary-key-id:
    description: secrets.NOTARY_KEY_ID
    required: true
  notary-key-p8:
    description: secrets.NOTARY_KEY_P8 (base64 of the .p8).
    required: true

outputs:
  submission-id:
    description: Apple's submission UUID.
    value: ${{ steps.notarize.outputs.submission-id }}
  seconds:
    description: Round-trip time in seconds.
    value: ${{ steps.notarize.outputs.seconds }}
  zip:
    description: Bundle mode only, the stapled release zip path.
    value: ${{ steps.notarize.outputs.zip }}

runs:
  using: composite
  steps:
    - name: Notarize
      id: notarize
      shell: bash
      env:
        BIN: ${{ inputs.binary }}
        BUNDLE: ${{ inputs.bundle }}
        OUTPUT_ZIP: ${{ inputs.output-zip }}
        TIMEOUT: ${{ inputs.timeout }}
        NOTARY_ISSUER_ID: ${{ inputs.notary-issuer-id }}
        NOTARY_KEY_ID: ${{ inputs.notary-key-id }}
        NOTARY_KEY_P8: ${{ inputs.notary-key-p8 }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "macOS" ]; then
          echo "::error::macos-notarize needs a macOS runner (notarytool); this is $RUNNER_OS"
          exit 1
        fi
        if [ -z "${NOTARY_ISSUER_ID:-}" ] || [ -z "${NOTARY_KEY_ID:-}" ] || [ -z "${NOTARY_KEY_P8:-}" ]; then
          echo "::error::NOTARY_ISSUER_ID / NOTARY_KEY_ID / NOTARY_KEY_P8 have no value; is this repository on the org secrets' repository list?"
          exit 1
        fi
        if [ -n "$BIN" ] && [ -n "$BUNDLE" ]; then
          echo "::error::pass exactly one of binary or bundle, not both"; exit 1
        fi
        if [ -z "$BIN" ] && [ -z "$BUNDLE" ]; then
          echo "::error::pass one of binary or bundle"; exit 1
        fi
        if [ -n "$BUNDLE" ]; then
          BUNDLE="${BUNDLE%/}"
          [ -d "$BUNDLE" ] || { echo "::error::no such bundle to notarize: $BUNDLE"; exit 1; }
          TARGET="$BUNDLE"
        else
          [ -e "$BIN" ] || { echo "::error::no such file to notarize: $BIN"; exit 1; }
          TARGET="$BIN"
        fi
        printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
        # notarytool only accepts an archive, never a bare executable, so the
        # binary is zipped for submission. Apple notarizes what is inside;
        # the zip is thrown away and the caller still ships the binary, which
        # now carries a signature Apple has vouched for.
        # A bundle needs --keepParent so the .app directory is the zip root.
        rm -f "$RUNNER_TEMP/notarize.zip"
        if [ -n "$BUNDLE" ]; then
          /usr/bin/ditto -c -k --keepParent "$BUNDLE" "$RUNNER_TEMP/notarize.zip"
        else
          /usr/bin/ditto -c -k "$BIN" "$RUNNER_TEMP/notarize.zip"
        fi
        started=$(date +%s)
        set +e
        xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
          --key "$RUNNER_TEMP/notary.p8" \
          --key-id "$NOTARY_KEY_ID" \
          --issuer "$NOTARY_ISSUER_ID" \
          --wait --timeout "$TIMEOUT" \
          --output-format json > "$RUNNER_TEMP/notary.out" 2> "$RUNNER_TEMP/notary.err"
        rc=$?
        set -e
        elapsed=$(( $(date +%s) - started ))
        mins=$(( elapsed / 60 ))
        echo "--- notarytool stdout ---"; cat "$RUNNER_TEMP/notary.out" || true
        echo "--- notarytool stderr ---"; cat "$RUNNER_TEMP/notary.err" || true
        # Every run records how long Apple took, so the next slow day has a
        # history to compare against instead of a guess.
        echo "notarization round trip: ${elapsed}s (${mins} min)"
        echo "seconds=$elapsed" >> "$GITHUB_OUTPUT"

        # Read the verdict from whichever stream carried it. When a release
        # timed out on 2026-09-15, its payload appeared exactly once in the
        # job log, equally consistent with stdout and with stderr. Try both
        # and take the first that parses.
        status=UNKNOWN
        sub="-"
        for f in "$RUNNER_TEMP/notary.out" "$RUNNER_TEMP/notary.err"; do
          [ -s "$f" ] || continue
          parsed="$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print((d.get('status') or 'UNKNOWN') + '\t' + (d.get('id') or '-'))" "$f" 2>/dev/null)" || continue
          [ -n "$parsed" ] || continue
          status="${parsed%%$'\t'*}"
          sub="${parsed##*$'\t'}"
          break
        done
        echo "submission-id=$sub" >> "$GITHUB_OUTPUT"

        # Only these three are verdicts. Anything else, including the
        # "In Progress" that a timeout may carry and the absent status it may
        # carry instead, means Apple has not finished.
        case "$status" in
          Accepted)
            if [ "$rc" != "0" ]; then
              echo "::error::Apple reported Accepted but notarytool exited $rc; refusing to treat that as success"
              exit 1
            fi
            echo "Apple notarized this binary (submission $sub, ${elapsed}s / ${mins} min)"
            ;;
          Invalid|Rejected)
            echo "::error::Apple rejected this binary (status=$status, submission $sub, after ${mins} min)"
            # The submission log is the only thing that says WHY.
            xcrun notarytool log "$sub" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
            exit 1
            ;;
          *)
            if [ "$sub" = "-" ]; then
              # No id means notarytool never got as far as a submission: bad
              # credentials, no network, a malformed archive.
              echo "::error::notarytool failed before Apple accepted a submission (exit $rc, after ${mins} min)"
              echo "::error::Its stdout and stderr are above. This is a client-side or credential failure, not a verdict."
            else
              echo "::error::Apple returned no verdict in ${mins} min, so this run stopped waiting (status=$status)."
              echo "::error::Submission $sub is still being processed. It was NOT rejected."
              echo "::error::Watch it with the 'Notary diagnostics' workflow in sentania-labs/.github, passing that id."
              echo "::error::Once Apple reports Accepted, re-run this workflow with: gh run rerun $GITHUB_RUN_ID --failed"
              echo "::error::That rebuilds and submits afresh rather than reusing this submission."
            fi
            exit 1
            ;;
        esac
        rm -f "$RUNNER_TEMP/notary.p8"
        if [ -n "$BUNDLE" ]; then
          # A stapled bundle is verifiable offline, so these are gates.
          xcrun stapler staple "$BUNDLE"
          xcrun stapler validate "$BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE"
          spctl -a -t exec -vv "$BUNDLE"
          codesign --verify --strict --test-requirement="=notarized" --verbose=2 "$BUNDLE"
          # The release asset is rebuilt AFTER stapling; the submission zip
          # has no ticket in it.
          OUT="${OUTPUT_ZIP:-$BUNDLE.zip}"
          rm -f "$OUT"
          /usr/bin/ditto -c -k --keepParent "$BUNDLE" "$OUT"
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"
          echo "stapled release zip: $OUT"
        else
          # A bare executable cannot carry a stapled ticket, so a Mac learns it
          # is notarized by asking Apple online. That lookup is a different
          # service from the one that just said Accepted and it lags by seconds
          # to a couple of minutes (seen 2026-10-07: 5 s after Accepted the
          # Intel runner got "Unnotarized Developer ID"). So the local check
          # waits for the ticket rather than warning: it retries for up to two
          # minutes and then FAILS, because a ticket that never shows up is a
          # real problem a user would hit on first launch.
          echo "--- notarization ticket visible to this Mac (gate, waits for propagation) ---"
          deadline=$(( $(date +%s) + 120 )); ok=0
          while :; do
            if codesign --verify --strict --test-requirement="=notarized" --verbose=2 "$BIN" 2>&1; then ok=1; break; fi
            [ "$(date +%s)" -ge "$deadline" ] && break
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Apple reported Accepted but the notarization ticket for $BIN was still not visible after 2 minutes"
            exit 1
          fi
          # spctl stays advisory for a bare executable: with `-t exec` it only
          # knows how to assess app bundles and answers "the code is valid but
          # does not seem to be an app" for any loose binary, signed or not.
          echo "--- gatekeeper assessment (advisory; always 'not an app' for a bare executable) ---"
          spctl -a -t exec -vv "$BIN" 2>&1 || echo "spctl has no verdict for a bare executable; the ticket check above is the gate"
        fi

    - name: Remove the signing keychain and key material
      if: always()
      shell: bash
      run: |
        security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/signing.keychain-db}" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" \
              "$RUNNER_TEMP/notarize.zip" "$RUNNER_TEMP/notary.out" "$RUNNER_TEMP/notary.err" 2>/dev/null || true
