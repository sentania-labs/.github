# Authenticode-sign Windows binaries with Azure Artifact Signing.
#
# Azure Artifact Signing (Microsoft's cloud signing service, formerly Trusted
# Signing) holds the certificate in Microsoft's HSM and issues short-lived
# certificates per signature, so no certificate file or password ever lives
# in GitHub. The job authenticates to Azure as an app registration with a
# client secret, the same shape as the macOS side (a certificate and a notary
# key held as org secrets). Chosen 2026-10-07 over OIDC federated credentials
# for simplicity: the default federated credential is one Azure entry per
# repository, and the org-wide alternatives (an org-level OIDC subject
# template, or Entra flexible credentials) add a concept nobody here would
# otherwise touch. Costs: the secret expires (2028-09-29 for the current one,
# on the app registration "app-signing"; the macOS certificate expires too),
# and any workflow in any org repo can sign. If the secret leaks, rotate it on
# the app registration and replace AZURE_CLIENT_SECRET; the app holds only the
# Certificate Profile Signer role, so that is the whole blast radius. No
# azure/login step and no `id-token` permission: the signing action takes the
# credentials directly.
#
# Runs on a Windows runner. Signs every file listed, SHA-256 digest, with an
# RFC 3161 timestamp from Microsoft so the signature outlives the short
# certificate. Fails loudly when the Azure identifiers have no value, the same
# way the macOS actions do: a release must never ship an unsigned .exe by
# accident.
#
# Credentials and identifiers come from the caller as inputs. They are
# sentania-labs org secrets visible to all repositories: AZURE_TENANT_ID,
# AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, plus the signing account and
# certificate profile names (ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT,
# ARTIFACT_SIGNING_PROFILE). Only the client secret is secret in itself;
# keeping the rest as secrets means one place to change them for every repo.

name: Windows sign
description: Authenticode-sign files through Azure Artifact Signing as an app registration (client secret).

inputs:
  files:
    description: Files to sign, comma or newline separated, as ABSOLUTE Windows paths (the signing action requires them; build the path from the workspace variable, as the README snippet does).
    required: true
  endpoint:
    description: Artifact Signing endpoint, e.g. https://eus.codesigning.azure.net/
    required: true
  signing-account-name:
    description: The Artifact Signing account name.
    required: true
  certificate-profile-name:
    description: The certificate profile (Public Trust) inside that account.
    required: true
  azure-tenant-id:
    description: secrets.AZURE_TENANT_ID
    required: true
  azure-client-id:
    description: secrets.AZURE_CLIENT_ID (the app registration "app-signing").
    required: true
  azure-client-secret:
    description: secrets.AZURE_CLIENT_SECRET (a client secret on that app registration; expires, see the header).
    required: true

runs:
  using: composite
  steps:
    - name: Refuse to run without every Azure identifier
      shell: bash
      env:
        AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
        AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
        AZURE_CLIENT_SECRET: ${{ inputs.azure-client-secret }}
        ENDPOINT: ${{ inputs.endpoint }}
        ACCOUNT: ${{ inputs.signing-account-name }}
        PROFILE: ${{ inputs.certificate-profile-name }}
      run: |
        if [ "$RUNNER_OS" != "Windows" ]; then
          echo "::error::windows-sign needs a Windows runner (signtool); this is $RUNNER_OS"
          exit 1
        fi
        missing=""
        for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET ENDPOINT ACCOUNT PROFILE; do
          if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
        done
        if [ -n "$missing" ]; then
          echo "::error::Windows signing inputs with no value:$missing"
          echo "::error::they are sentania-labs org secrets (visibility: all repositories); check the org secret names, or this run is from a fork or Dependabot (which see no org secrets), or do not call windows-sign yet"
          exit 1
        fi

    - name: Sign
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
      with:
        # The action builds a DefaultAzureCredential; with these three set the
        # environment credential is tried first and a failed login stops there.
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-client-secret: ${{ inputs.azure-client-secret }}
        exclude-azure-cli-credential: true
        exclude-managed-identity-credential: true
        exclude-workload-identity-credential: true
        endpoint: ${{ inputs.endpoint }}
        signing-account-name: ${{ inputs.signing-account-name }}
        certificate-profile-name: ${{ inputs.certificate-profile-name }}
        files: ${{ inputs.files }}
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Verify the signatures
      shell: pwsh
      env:
        FILES: ${{ inputs.files }}
      run: |
        $ErrorActionPreference = 'Stop'
        $list = $env:FILES -split '[,\r\n]+' | Where-Object { $_.Trim() -ne '' }
        foreach ($f in $list) {
          $sig = Get-AuthenticodeSignature -FilePath $f.Trim()
          Write-Host ("{0}: {1} ({2})" -f $f.Trim(), $sig.Status, $sig.SignerCertificate.Subject)
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::$f is not validly signed: $($sig.Status) $($sig.StatusMessage)"
            exit 1
          }
        }
