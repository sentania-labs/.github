# Sign a macOS binary with the org's Developer ID Application identity.
#
# Without signing and notarization macOS refuses to run a download at all:
# Gatekeeper shows "cannot be opened because Apple cannot check it for
# malicious software" and there is no obvious way past it. This action does
# the signing half; macos-notarize does the other. Run them in that order,
# with the caller's own smoke test in between if it has one: a signed binary
# that fails to start is caught in seconds that way, instead of after Apple's
# round trip.
#
# Runs only on a macOS runner (codesign and the keychain are macOS-only).
# Imports the certificate into a throwaway keychain, signs with the hardened
# runtime and a trusted timestamp, then verifies strictly and checks the
# team. The keychain is removed by macos-notarize's cleanup, by this action's
# own cleanup when it fails, or by the caller's `if: always()` step (see the
# README) when the caller's own step between sign and notarize fails.
#
# Secrets come from the caller as inputs (a composite action cannot read
# secrets itself). They are sentania-labs org secrets: MACOS_CERT_P12 (base64
# of the .p12), MACOS_CERT_PASSWORD, MACOS_TEAM_ID.

name: macOS sign
description: Sign a binary with the Developer ID Application identity, hardened runtime, timestamp.

inputs:
  binary:
    description: Path of a bare Mach-O executable to sign. Exactly one of binary or bundle.
    required: false
    default: ""
  bundle:
    description: >
      Path of a .app bundle to sign. Nested code (dylibs, .so, frameworks, helper
      executables, XPC services, inner apps) is signed first, deepest first, then
      the bundle itself; --deep is never used for signing. Exactly one of binary
      or bundle.
    required: false
    default: ""
  entitlements:
    description: >
      Entitlements plist. Defaults to this action's plist, which disables library
      validation and nothing else, the one entitlement a PyInstaller one-file binary
      needs under the hardened runtime. Pass your own for anything else.
    required: false
    default: ""
  macos-cert-p12:
    description: secrets.MACOS_CERT_P12 (base64 of the certificate + key export).
    required: true
  macos-cert-password:
    description: secrets.MACOS_CERT_PASSWORD
    required: true
  macos-team-id:
    description: secrets.MACOS_TEAM_ID (10 characters); the signature must carry it.
    required: true

outputs:
  sign-id:
    description: SHA-1 of the identity that signed.
    value: ${{ steps.import.outputs.sign-id }}

runs:
  using: composite
  steps:
    - name: Refuse a non-macOS runner
      shell: bash
      run: |
        if [ "$RUNNER_OS" != "macOS" ]; then
          echo "::error::macos-sign needs a macOS runner (codesign); this is $RUNNER_OS"
          exit 1
        fi

    - name: Import the signing certificate
      id: import
      shell: bash
      env:
        MACOS_CERT_P12: ${{ inputs.macos-cert-p12 }}
        MACOS_CERT_PASSWORD: ${{ inputs.macos-cert-password }}
      run: |
        set -euo pipefail
        # Fail here, loudly, rather than three steps later with a confusing
        # "no identity found".
        if [ -z "${MACOS_CERT_P12:-}" ] || [ -z "${MACOS_CERT_PASSWORD:-}" ]; then
          echo "::error::MACOS_CERT_P12 / MACOS_CERT_PASSWORD have no value; is this repository on the org secrets' repository list?"
          exit 1
        fi
        # A throwaway keychain, so nothing is left behind on the runner and
        # the login keychain is never touched.
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PW="$(/usr/bin/openssl rand -base64 24)"
        echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
        # A second call in the same job would otherwise fail on the existing file.
        security delete-keychain "$KEYCHAIN" 2>/dev/null || true
        security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
        printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
          -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$RUNNER_TEMP/cert.p12"
        # Without this, codesign blocks on a GUI prompt that no one can
        # answer and the job hangs until it is cancelled.
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        # Exactly one identity must be present. Matching by name would be a
        # substring match that could silently pick the wrong certificate if
        # a second one ever lands in here; the SHA-1 cannot.
        found="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Developer ID Application' || true)"
        if [ "$found" != "1" ]; then
          echo "::error::expected exactly one Developer ID Application identity, found $found"
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          exit 1
        fi
        SIGN_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | awk '{print $2}')"
        echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"
        echo "sign-id=$SIGN_ID" >> "$GITHUB_OUTPUT"

    - name: Sign
      shell: bash
      env:
        BIN: ${{ inputs.binary }}
        BUNDLE: ${{ inputs.bundle }}
        ENTITLEMENTS: ${{ inputs.entitlements }}
        MACOS_TEAM_ID: ${{ inputs.macos-team-id }}
      run: |
        set -euo pipefail
        if [ -n "$BIN" ] && [ -n "$BUNDLE" ]; then
          echo "::error::pass exactly one of binary or bundle, not both"; exit 1
        fi
        if [ -z "$BIN" ] && [ -z "$BUNDLE" ]; then
          echo "::error::pass one of binary or bundle"; exit 1
        fi
        TARGET="${BIN:-$BUNDLE}"
        [ -e "$TARGET" ] || { echo "::error::no such file to sign: $TARGET"; exit 1; }
        if [ -n "$BUNDLE" ]; then
          case "$BUNDLE" in *.app|*.app/) ;; *) echo "::error::bundle must be a .app directory: $BUNDLE"; exit 1;; esac
          [ -d "$BUNDLE" ] || { echo "::error::bundle is not a directory: $BUNDLE"; exit 1; }
        fi
        ENT="${ENTITLEMENTS:-${{ github.action_path }}/entitlements-disable-library-validation.plist}"
        [ -f "$ENT" ] || { echo "::error::entitlements file not found: $ENT"; exit 1; }

        if [ -n "$BUNDLE" ]; then
          BUNDLE="${BUNDLE%/}"
          # Nested code first, deepest path first, so every container is
          # signed after what it contains and its seal covers the final
          # children. --deep would sign in the wrong order and apply one set
          # of options to everything, so it is used only to VERIFY. Mach-O
          # detection is by content (file(1)), not extension: PyInstaller
          # ships extension modules as .so and plain executables with none.
          # Inner .app/.framework/.xpc directories are signed as bundles
          # (their own main executable is signed by that call).
          # Nested items get no entitlements; the main app gets the plist.
          # The app's own main executable (Info.plist CFBundleExecutable) is
          # left to the final bundle signature so it picks up the entitlements.
          MAIN_EXE="$BUNDLE/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$BUNDLE/Contents/Info.plist")"
          [ -f "$MAIN_EXE" ] || { echo "::error::CFBundleExecutable not found at $MAIN_EXE"; exit 1; }
          list="$RUNNER_TEMP/nested.list"
          : > "$list"
          while IFS= read -r -d '' f; do
            [ "$f" = "$MAIN_EXE" ] && continue
            [ -L "$f" ] && continue
            if file -b "$f" | grep -q 'Mach-O'; then printf '%s\0' "$f" >> "$list"; fi
          done < <(find "$BUNDLE/Contents" -type f -print0)
          while IFS= read -r -d '' d; do
            printf '%s\0' "$d" >> "$list"
          done < <(find "$BUNDLE/Contents" -type d \( -name '*.app' -o -name '*.framework' -o -name '*.xpc' \) -print0)
          # Sort by path depth, deepest first.
          python3 - "$list" <<'PY'
        import sys
        p = sys.argv[1]
        items = [x for x in open(p, 'rb').read().split(b'\0') if x]
        items.sort(key=lambda x: (-x.count(b'/'), x))
        open(p, 'wb').write(b'\0'.join(items) + (b'\0' if items else b''))
        PY
          n=0
          while IFS= read -r -d '' f; do
            codesign --force --sign "$SIGN_ID" --options runtime --timestamp "$f"
            n=$((n+1))
          done < "$list"
          rm -f "$list"
          echo "signed $n nested item(s)"
          codesign --force --sign "$SIGN_ID" \
            --options runtime \
            --entitlements "$ENT" \
            --timestamp \
            "$BUNDLE"
          # --deep is correct here: as a verifier it walks every nested
          # item, which is the check that signing inside out worked.
          codesign --verify --deep --strict --verbose=2 "$BUNDLE"
          TARGET="$BUNDLE"
        else
          # --options runtime is the hardened runtime, which notarization
          # requires. --timestamp gets a trusted timestamp from Apple, without
          # which the signature stops verifying the day the certificate
          # expires rather than remaining valid for what was signed while it
          # was live.
          codesign --force --sign "$SIGN_ID" \
            --options runtime \
            --entitlements "$ENT" \
            --timestamp \
            "$TARGET"
          # --strict matters specifically here: a PyInstaller one-file binary
          # is a Mach-O with an archive glued onto the end of it, and a
          # non-strict verify is happy with things Apple's notary service is
          # not. Without it, the cheap check passes and the slow one fails.
          codesign --verify --strict --verbose=2 "$TARGET"
        fi
        codesign --display --verbose=4 "$TARGET" 2>&1 | grep -E 'Authority|TeamIdentifier|flags=' || true
        # Notarization rejects anything without the hardened runtime, and it
        # rejects it after a slow round trip. Catch a missing flag here.
        if ! codesign --display --verbose=4 "$TARGET" 2>&1 | grep -qE 'flags=.*runtime'; then
          echo "::error::the signed target does not carry the hardened runtime flag"
          exit 1
        fi
        # The signature must carry the team this org releases under. A
        # certificate swapped for a different team's would still sign, still
        # notarize, and still run, and nobody would notice until someone
        # asked who published the thing.
        signed_team="$(codesign --display --verbose=4 "$TARGET" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
        if [ "$signed_team" != "$MACOS_TEAM_ID" ]; then
          echo "::error::signed under team '$signed_team', expected '$MACOS_TEAM_ID'"
          exit 1
        fi
        echo "signed $TARGET under team $signed_team"

    - name: Remove the keychain if signing failed
      if: failure()
      shell: bash
      run: |
        security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/signing.keychain-db}" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
